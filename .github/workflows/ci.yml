name: CI

# Runs entirely on GitHub-hosted runners with no GPU. That is deliberate: this
# repository must be buildable and testable by anyone, so CI may not depend on
# self-hosted hardware.
#
# What this cannot cover, and what still needs a real GPU:
#   * verification against actual silicon
#   * concurrency nondeterminism. The mock backend runs a single logical
#     thread, so atomic ordering there is trivially deterministic. A kernel
#     whose result depends on execution order verifies clean under mock and
#     fails on hardware -- that class of bug is invisible here by construction.
#
# The pantheonsim job at the end narrows the first gap without a GPU: it runs
# every compiled workload on simulated GPUs, so the multi-GPU, matrix-core and
# media workloads that the mock backend can only skip are executed, and a change
# is answered here and not by the next daily run over there. It checks function,
# not speed, and the simulator runs threads in a fixed order, so it is no help
# with the second gap either.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and mock backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Build mock backend
        run: |
          make PLATFORM=MOCK -j"$(nproc)"
          count="$(ls build | grep -vc '^\.')"
          echo "Built ${count} binaries"
          # A silently short build would otherwise pass every check below.
          if [ "${count}" -lt 40 ]; then
            echo "::error::Expected at least 40 binaries, built ${count}"
            exit 1
          fi

      - name: Smoke test the runner
        run: python3 pantheon.py --test baseline_metrics --duration 5 --mem 5

      - name: Workloads compiled ahead of time run without a compiler lookup
        run: |
          set -o pipefail
          cache="${RUNNER_TEMP}/precompiled"
          PANTHEON_BUILD_CACHE_DIR="${cache}" python3 pantheon.py --build-only --platform mock
          # A run that takes the backend from the environment, as a module file
          # would set it, must find the compiled workloads and compile nothing.
          PANTHEON_BUILD_CACHE_DIR="${cache}" PANTHEON_PLATFORM=mock \
            python3 pantheon.py --test memory_read --duration 2 --mem 5 | tee "${RUNNER_TEMP}/precompiled.log"
          grep -q "Kernel build cache is current" "${RUNNER_TEMP}/precompiled.log"

      - name: Verification must pass clean and fail on an injected fault
        run: |
          # The point of this step is the second half. A workload whose
          # verification silently does nothing passes the clean run too, so only
          # the injected case proves the check is wired up.
          fail=0
          for w in memory_read memory_write march_test galpat memory_hammer \
                   atomic_virus llm_decode llm_prefill graph_replay kv_cache_churn \
                   memory_thermal_asym moe_router allocation_fragmentation; do
            if ! ./build/"$w" 0 2 5 --verify >/tmp/clean.log 2>&1; then
              echo "::error::${w} failed a clean verification"; fail=1; continue
            fi
            if ./build/"$w" 0 2 5 --verify --inject_error >/tmp/inj.log 2>&1; then
              if ! grep -q "Verification: FAIL\|SDC FAULT" /tmp/inj.log; then
                echo "::error::${w} did not detect its injected fault"; fail=1
              fi
            fi
          done
          exit "${fail}"

      - name: Node check of the integrations on the mock backend
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          printf '#!/bin/bash\nexec python3 "%s/pantheon.py" "$@"\n' "${GITHUB_WORKSPACE}" \
            > "${RUNNER_TEMP}/bin/pantheon"
          chmod +x "${RUNNER_TEMP}/bin/pantheon"
          check="python3 integrations/pantheon_node_check.py --pantheon ${RUNNER_TEMP}/bin/pantheon"
          ${check} --platform mock --test march_test --duration 2
          # An injected fault has to come out as a fault, exit code 2.
          printf '#!/bin/bash\nexec python3 "%s/pantheon.py" --inject_error "$@"\n' "${GITHUB_WORKSPACE}" \
            > "${RUNNER_TEMP}/bin/pantheon-fault"
          chmod +x "${RUNNER_TEMP}/bin/pantheon-fault"
          code=0
          python3 integrations/pantheon_node_check.py --pantheon "${RUNNER_TEMP}/bin/pantheon-fault" \
            --platform mock --test march_test --duration 2 || code=$?
          if [ "${code}" -ne 2 ]; then
            echo "::error::The node check answered ${code} to an injected fault, expected 2"
            exit 1
          fi

      - name: Documentation builds
        run: python -m mkdocs build --strict

  cuda-compile:
    name: CUDA compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: nvidia/cuda:12.6.3-devel-ubuntu24.04
    steps:
      - name: Bootstrap container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git make g++ findutils

      - uses: actions/checkout@v4

      # No GPU here, and none needed: nvcc compiles without one. Architecture
      # detection finds no nvidia-smi and falls back to a default, and OptiX is
      # absent so rt_virus builds its dummy kernel. This catches the syntax and
      # intrinsic errors the mock backend's stubs hide -- a device intrinsic
      # missing from the mock still has to compile for real hardware.
      - name: Compile every kernel for CUDA
        run: |
          make PLATFORM=CUDA -j"$(nproc)"
          count="$(ls build | grep -vc '^\.')"
          echo "Compiled ${count} binaries"
          if [ "${count}" -lt 40 ]; then
            echo "::error::Expected at least 40 binaries, compiled ${count}"
            exit 1
          fi

  hip-compile:
    name: HIP compile (ROCm ${{ matrix.rocm }}, ${{ matrix.gfx }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # 6.4 is what the ROCm container image ships, 7.x is current. The
          # two disagree about warp intrinsics, which is how fused_attention
          # went unbuilt on every ROCm release without any test noticing.
          # gfx942 takes the MFMA path, gfx1100 the WMMA path. gfx1030 has no
          # matrix instructions at all: mma_virus and transformer_virus build
          # as deliberate skips and omni_virus builds without its tensor stream.
          - rocm: "6.4.4"
            gfx: gfx942
          - rocm: "7.2.4"
            gfx: gfx942
          - rocm: "7.2.4"
            gfx: gfx1100
          - rocm: "7.2.4"
            gfx: gfx1030
    container:
      image: rocm/dev-ubuntu-24.04:${{ matrix.rocm }}
    steps:
      - uses: actions/checkout@v4

      # No GPU here, and none needed: hipcc cross-compiles for the named
      # target, and HIP-RT is absent so rt_virus builds its dummy kernel. A
      # plain make stops at the first kernel that fails, so one workload that
      # does not build is a red job instead of a quiet "unavailable" on AMD.
      - name: Compile every kernel for HIP
        run: |
          make PLATFORM=HIP TARGET_GFX=${{ matrix.gfx }} -j"$(nproc)"
          count="$(ls build | grep -vc '^\.')"
          echo "Compiled ${count} binaries"
          if [ "${count}" -lt 40 ]; then
            echo "::error::Expected at least 40 binaries, compiled ${count}"
            exit 1
          fi

  # The workloads, compiled by their own Makefile and run on two simulated A10s.
  #
  # pantheonsim (https://github.com/pantheongpu/pantheonsim) already runs every
  # workload of main on 37 simulated machines each day. This is the same runner,
  # on one machine, for the change in front of you. Two GPUs, so the multi-GPU
  # workloads (all_reduce, p2p_thrasher, p2p_matrix) take their peer paths;
  # nccl_all_reduce reports a skip, as it needs the group of processes that
  # pantheon.py starts.
  #
  # The Action is pinned to a commit and so is the simulator it builds; move the
  # pin on purpose. The first run after a new pin builds the simulator (about
  # twenty minutes); the Action caches that build under its source, and main
  # pushes keep the cache warm for pull requests. Not a required check: a break
  # in the simulator should not stop a merge here.
  pantheonsim:
    name: Workloads on pantheonsim (2 x A10)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # A pull request that touches no workload, no Makefile and not this job has
      # nothing new to run. A push to main or a manual run always runs, which is
      # what keeps the simulator's cache warm for the pull requests.
      - name: Does this change touch the workloads?
        id: relevant
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          if git diff --name-only "$BASE" HEAD | grep -qE '^(kernels/|Makefile$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No workload, Makefile or CI change: nothing to run on the simulator." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: PantheonSim
        if: steps.relevant.outputs.run == 'true'
        id: sim
        uses: pantheongpu/pantheonsim@bd64667661fb33f180567356b1a1f60f2b095edc
        with:
          gpu: nvidia/a10
          count: 2
          # The runner builds and runs the workloads inside `vgpu shell`; putting the
          # simulator's libraries on the job's path would only get in the way of the
          # toolkit's own.
          library-path: "false"

      # The runner skips cleanly (and exits 0) when it cannot start, so a job that
      # ran nothing would look green. The check after it asks for results.
      - name: Run every workload on the simulator
        if: steps.relevant.outputs.run == 'true'
        env:
          VGPU_PANTHEON_DIR: ${{ github.workspace }}
          VGPU_BUILD_DIR: ${{ steps.sim.outputs.build-dir }}
          VGPU_WORKLOADS: all
          VGPU_WORKLOAD_GPU: nvidia/a10
          VGPU_WORKLOAD_COUNT: "2"
          # CPU-sized, the way the simulator's own daily run is: the same code over a
          # smaller working set. A GPU retires about 10^13 operations a second and
          # the simulator about 10^8.
          VGPU_WORKLOAD_SECONDS: "5"
          VGPU_WORKLOAD_ARGS: --kernel_loops 2 --warmup_iters 1 --grid_size 4
          VGPU_WORKLOAD_TIMEOUT: "300"
          VGPU_WORKLOAD_GEMM_SIZE: "256"
          VGPU_WORKLOAD_REPORT: ${{ runner.temp }}/report
        run: |
          "${{ steps.sim.outputs.source-dir }}/tests/workloads/run_pantheon_workloads.sh"

      - name: Did it run anything?
        if: steps.relevant.outputs.run == 'true'
        run: |
          results="$RUNNER_TEMP/report/results.tsv"
          if [ ! -s "$results" ] || ! grep -q "$(printf '\tPASS\t')" "$results"; then
            echo "::error::The runner wrote no passing result, so no workload ran on the simulator"
            exit 1
          fi
          cat "$RUNNER_TEMP/report/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always() && steps.relevant.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: workloads-on-pantheonsim
          path: ${{ runner.temp }}/report
          retention-days: 14
          if-no-files-found: ignore
