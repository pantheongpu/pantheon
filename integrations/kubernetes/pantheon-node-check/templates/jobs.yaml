{{- range .Values.nodes }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "pantheon-%s" . | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/name: pantheon-node-check
    app.kubernetes.io/instance: {{ $.Release.Name }}
    pantheongpu.com/node: {{ . | quote }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ $.Values.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pantheon-node-check
        app.kubernetes.io/instance: {{ $.Release.Name }}
    spec:
      restartPolicy: Never
      nodeName: {{ . | quote }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pantheon
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          args:
            - "--test"
            - {{ $.Values.workload | quote }}
            - "--duration"
            - {{ $.Values.duration | quote }}
            - "--gpu"
            - "all"
            {{- range $.Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          workingDir: /reports
          resources:
            limits:
              nvidia.com/gpu: {{ $.Values.gpusPerNode }}
          volumeMounts:
            - name: reports
              mountPath: /reports
            - name: build-cache
              mountPath: /root/.cache
      volumes:
        - name: reports
          {{- if $.Values.reports.persistentVolumeClaim }}
          persistentVolumeClaim:
            claimName: {{ $.Values.reports.persistentVolumeClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: build-cache
          emptyDir: {}
{{- end }}
