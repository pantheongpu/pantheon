<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-labelledby="title desc">
  <title id="title">Transformer Virus flow</title><desc id="desc">Animated diagram showing architecture selection feeding matrix engines and accumulated verification.</desc>
  <style>.bg{fill:#0f172a}.box{fill:#1e293b;stroke:#a78bfa;stroke-width:2}.t{font:15px monospace;fill:#f5f3ff}.s{font:12px monospace;fill:#ddd6fe}.a{stroke:#a78bfa;stroke-width:4;marker-end:url(#m)}.p{fill:#22d3ee}</style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/></marker></defs>
  <rect class="bg" width="820" height="220"/><rect class="box" x="40" y="62" width="185" height="105" rx="8"/><text class="t" x="78" y="102">Arch Path</text><text class="s" x="62" y="128">MFMA/WGMMA/WMMA</text>
  <rect class="box" x="330" y="62" width="170" height="105" rx="8"/><text class="t" x="372" y="102">Matrix</text><text class="s" x="362" y="128">tensor loops</text>
  <rect class="box" x="610" y="62" width="155" height="105" rx="8"/><text class="t" x="648" y="102">Sink</text><text class="s" x="635" y="128">bit accum</text>
  <line class="a" x1="225" y1="115" x2="330" y2="115"/><line class="a" x1="500" y1="115" x2="610" y2="115"/>
  <circle class="p" cx="415" cy="115" r="8"><animate attributeName="r" values="8;24;8" dur="1.1s" repeatCount="indefinite"/></circle>
</svg>
