<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-labelledby="title desc">
  <title id="title">Scheduler Virus flow</title><desc id="desc">Animated diagram showing many streams launching tiny kernels into the scheduler.</desc>
  <style>.bg{fill:#111827}.q{fill:#1f2937;stroke:#38bdf8;stroke-width:2}.t{font:15px monospace;fill:#e0f2fe}.p{fill:#facc15}</style>
  <rect class="bg" width="820" height="220"/><text class="t" x="70" y="42">Many streams, tiny kernels</text>
  <rect class="q" x="80" y="65" width="140" height="30" rx="6"/><rect class="q" x="80" y="105" width="140" height="30" rx="6"/><rect class="q" x="80" y="145" width="140" height="30" rx="6"/><text class="t" x="105" y="86">stream 0</text><text class="t" x="105" y="126">stream 1</text><text class="t" x="105" y="166">stream N</text>
  <rect class="q" x="360" y="75" width="180" height="100" rx="8"/><text class="t" x="410" y="128">Scheduler</text>
  <rect class="q" x="650" y="85" width="110" height="80" rx="8"/><text class="t" x="675" y="128">Sink</text>
  <circle class="p" cx="240" cy="80" r="6"><animate attributeName="cx" values="240;520;240" dur="1s" repeatCount="indefinite"/></circle><circle class="p" cx="240" cy="120" r="6"><animate attributeName="cx" values="240;520;240" dur="1.2s" repeatCount="indefinite"/></circle><circle class="p" cx="240" cy="160" r="6"><animate attributeName="cx" values="240;520;240" dur="1.4s" repeatCount="indefinite"/></circle>
</svg>
