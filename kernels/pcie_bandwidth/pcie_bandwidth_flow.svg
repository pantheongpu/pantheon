<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">PCIe Bandwidth execution flow</title>
  <desc id="desc">Animated diagram showing simultaneous host-to-device and device-to-host DMA transfers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#cbd5e1"/></marker>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.label{fill:#f8fafc;font:700 19px Arial,sans-serif}.small{fill:#cbd5e1;font:14px Arial,sans-serif}.box{fill:#0f172a;stroke:#64748b;stroke-width:2;rx:8}.lane{stroke:#cbd5e1;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="900" height="360" fill="#111827"/>
  <text x="32" y="42" class="label">PCIe Bandwidth: bidirectional DMA pressure</text>
  <text x="32" y="66" class="small">Pinned host buffers and device buffers move data in both directions on separate streams.</text>
  <rect x="70" y="116" width="220" height="110" class="box"/><text x="128" y="158" class="label">Host RAM</text><text x="104" y="184" class="small">pinned source/dest</text>
  <rect x="610" y="116" width="220" height="110" class="box"/><text x="672" y="158" class="label">GPU VRAM</text><text x="642" y="184" class="small">device source/dest</text>
  <path d="M290 150 C410 92 490 92 610 150" class="lane"/>
  <path d="M610 198 C490 256 410 256 290 198" class="lane"/>
  <circle r="12" fill="#22c55e" filter="url(#glow)"><animateMotion dur="1.8s" repeatCount="indefinite" path="M290 150 C410 92 490 92 610 150"/></circle>
  <circle r="12" fill="#38bdf8" filter="url(#glow)"><animateMotion dur="1.8s" repeatCount="indefinite" path="M610 198 C490 256 410 256 290 198"/></circle>
  <text x="70" y="286" class="small">kernel_loops batches DMA copies before stream synchronization; verification checks both H2D and D2H payloads.</text>
</svg>
