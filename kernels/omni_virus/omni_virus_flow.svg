<svg xmlns="http://www.w3.org/2000/svg" width="820" height="265" viewBox="0 0 820 265" role="img" aria-labelledby="title desc">
  <title id="title">Omni Virus flow</title><desc id="desc">Animated diagram showing tensor, memory, FP16, FP32, and SFU streams running concurrently, with the tensor stream holding the largest share of the grid.</desc>
  <style>.bg{fill:#111827}.lane{fill:#1f2937;stroke:#a78bfa;stroke-width:2}.hot{fill:#312e81;stroke:#f472b6;stroke-width:2}.t{font:15px monospace;fill:#f5f3ff}.p{fill:#22d3ee}.h{fill:#fb7185}</style>
  <rect class="bg" width="820" height="265"/><rect class="hot" x="80" y="35" width="660" height="32" rx="6"/><rect class="lane" x="80" y="80" width="660" height="32" rx="6"/><rect class="lane" x="80" y="125" width="660" height="32" rx="6"/><rect class="lane" x="80" y="170" width="660" height="32" rx="6"/><rect class="lane" x="80" y="215" width="660" height="32" rx="6"/>
  <text class="t" x="105" y="57">Tensor stream (largest share)</text><text class="t" x="105" y="102">Memory stream</text><text class="t" x="105" y="147">FP16 stream</text><text class="t" x="105" y="192">FP32 stream</text><text class="t" x="105" y="237">SFU stream</text>
  <circle class="h" cx="380" cy="51" r="7"><animate attributeName="cx" values="380;710;380" dur="1.0s" repeatCount="indefinite"/></circle><circle class="p" cx="260" cy="96" r="7"><animate attributeName="cx" values="260;710;260" dur="1.1s" repeatCount="indefinite"/></circle><circle class="p" cx="340" cy="141" r="7"><animate attributeName="cx" values="340;710;340" dur="1.4s" repeatCount="indefinite"/></circle><circle class="p" cx="420" cy="186" r="7"><animate attributeName="cx" values="420;710;420" dur="1.2s" repeatCount="indefinite"/></circle><circle class="p" cx="500" cy="231" r="7"><animate attributeName="cx" values="500;710;500" dur="1.6s" repeatCount="indefinite"/></circle>
</svg>
