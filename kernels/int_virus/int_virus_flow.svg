<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">INT Virus execution flow</title>
  <desc id="desc">Animated diagram showing integer state flowing through LCG math, bit rotation, XOR mixing, and accumulation.</desc>
  <style>
    .bg{fill:#101820}.panel{fill:#1b2a30;stroke:#facc15;stroke-width:2}.text{font:16px monospace;fill:#fefce8}.small{font:13px monospace;fill:#fef08a}.arrow{stroke:#facc15;stroke-width:4;marker-end:url(#arrow)}.bit{fill:#22d3ee}.hot{fill:#fb923c}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#facc15"/></marker></defs>
  <rect class="bg" width="900" height="260"/>
  <rect class="panel" x="35" y="70" width="145" height="110" rx="8"/>
  <text class="text" x="72" y="112">Seed</text>
  <text class="small" x="60" y="142">tid state</text>
  <rect class="panel" x="245" y="52" width="155" height="146" rx="8"/>
  <text class="text" x="286" y="95">LCG</text>
  <text class="small" x="268" y="130">mul + add</text>
  <rect class="panel" x="460" y="52" width="155" height="146" rx="8"/>
  <text class="text" x="492" y="95">Rotate</text>
  <text class="small" x="494" y="130">shift/or</text>
  <rect class="panel" x="675" y="52" width="155" height="146" rx="8"/>
  <text class="text" x="720" y="95">XOR</text>
  <text class="small" x="705" y="130">accumulate</text>
  <line class="arrow" x1="180" y1="125" x2="245" y2="125"/>
  <line class="arrow" x1="400" y1="125" x2="460" y2="125"/>
  <line class="arrow" x1="615" y1="125" x2="675" y2="125"/>
  <path class="arrow" d="M753 52 C753 18 320 18 320 52" fill="none"/>
  <rect class="bit" x="275" y="154" width="22" height="12">
    <animate attributeName="x" values="275;360;275" dur="1.3s" repeatCount="indefinite"/>
  </rect>
  <circle class="hot" cx="536" cy="155" r="9">
    <animate attributeName="r" values="7;18;7" dur="1.1s" repeatCount="indefinite"/>
  </circle>
  <text class="small" x="280" y="235">Goal: saturate integer ALUs with deterministic bit mixing</text>
</svg>
