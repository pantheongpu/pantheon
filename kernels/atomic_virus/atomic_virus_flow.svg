<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">Atomic Virus execution flow</title>
  <desc id="desc">Animated diagram showing many thread lanes converging into atomic read-modify-write cache lines.</desc>
  <style>
    .bg{fill:#111827}.panel{fill:#1f2937;stroke:#93c5fd;stroke-width:2}.text{font:16px monospace;fill:#eff6ff}.small{font:13px monospace;fill:#bfdbfe}.arrow{stroke:#93c5fd;stroke-width:3;marker-end:url(#arrow)}.lane{stroke:#fbbf24;stroke-width:4}.cell{fill:#374151;stroke:#f97316;stroke-width:2}.flash{fill:#f97316}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#93c5fd"/></marker></defs>
  <rect class="bg" width="900" height="260"/>
  <rect class="panel" x="35" y="40" width="180" height="180" rx="8"/>
  <text class="text" x="82" y="78">Threads</text>
  <line class="lane" x1="70" y1="105" x2="180" y2="105"/>
  <line class="lane" x1="70" y1="130" x2="180" y2="130"/>
  <line class="lane" x1="70" y1="155" x2="180" y2="155"/>
  <line class="lane" x1="70" y1="180" x2="180" y2="180"/>
  <rect class="panel" x="330" y="52" width="220" height="156" rx="8"/>
  <text class="text" x="365" y="88">Atomic Add</text>
  <text class="small" x="360" y="120">read + modify + write</text>
  <text class="small" x="375" y="148">kernel_loops</text>
  <rect class="panel" x="680" y="52" width="170" height="156" rx="8"/>
  <text class="text" x="713" y="88">VRAM/L2</text>
  <rect class="cell" x="715" y="118" width="100" height="24"/>
  <rect class="cell" x="715" y="152" width="100" height="24"/>
  <line class="arrow" x1="215" y1="130" x2="330" y2="130"/>
  <line class="arrow" x1="550" y1="130" x2="680" y2="130"/>
  <circle class="flash" cx="440" cy="130" r="11">
    <animate attributeName="r" values="8;22;8" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <rect class="flash" x="715" y="118" width="100" height="24" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.75;0.1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text class="small" x="264" y="235">Goal: saturate atomic ordering and cache-line arbitration paths</text>
</svg>
