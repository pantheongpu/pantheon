<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
  <title id="title">Pulse Virus execution flow</title>
  <desc id="desc">Animated diagram showing alternating load-on FMA spikes and load-off sleeps for transient power stress.</desc>
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.label{fill:#f8fafc;font:700 19px Arial,sans-serif}.small{fill:#cbd5e1;font:14px Arial,sans-serif}.box{fill:#0f172a;stroke:#64748b;stroke-width:2;rx:8}</style>
  </defs>
  <rect width="900" height="360" fill="#111827"/>
  <text x="32" y="42" class="label">Pulse Virus: transient power delivery stress</text>
  <text x="32" y="66" class="small">The workload alternates heavy FMA spikes with host-side sleeps to create repeated current ramps.</text>
  <rect x="70" y="118" width="250" height="96" class="box"/><text x="118" y="154" class="label">Load ON</text><text x="102" y="180" class="small">dense FP32 FMA spike</text>
  <rect x="580" y="118" width="250" height="96" class="box"/><text x="632" y="154" class="label">Load OFF</text><text x="614" y="180" class="small">sleep for init_pattern ms</text>
  <path d="M320 166 C410 96 490 96 580 166" stroke="#f97316" stroke-width="5" fill="none"/>
  <path d="M580 198 C490 268 410 268 320 198" stroke="#38bdf8" stroke-width="5" fill="none"/>
  <circle r="13" fill="#f97316" filter="url(#glow)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M320 166 C410 96 490 96 580 166"/></circle>
  <circle r="11" fill="#38bdf8" filter="url(#glow)"><animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M580 198 C490 268 410 268 320 198"/></circle>
  <text x="74" y="286" class="small">The spike/drop cycle is useful for exposing PSU, VRM, clock recovery, and driver watchdog instability.</text>
</svg>
